baseURL = "https://hannody.github.io/"
title = "Mohanad Abu-Nayla"
theme = "PaperMod"

defaultContentLanguage = "en"

# Hugo emits public/robots.txt only when this is true; GitHub Pages serves
# none otherwise. See layouts/robots.txt for the body.
enableRobotsTXT = true

# Real dateModified/lastmod from commit timestamps instead of the front-matter
# date. Needs full git history: see fetch-depth in .github/workflows/deploy.yaml.
enableGitInfo = true

# First hit wins. An explicit lastmod beats :git, so a commit that touches a file
# without changing what it says (a front-matter edit, a typo fix) cannot claim to
# be a modification. Posts without the field still get their date from :git.
[frontmatter]
  lastmod = ["lastmod", ":git", "date", "publishDate"]

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1

[params]
  mainSections = ["posts"]
  ShowReadingTime = true

  # Consumed by PaperMod's templates/schema_json.html: author feeds
  # BlogPosting.author, schema.publisherType the publisher block (a one-person
  # blog is a Person, not an Organization), sameAs the identity links.
  author = "Mohanad Abu-Nayla"

  [params.schema]
    publisherType = "Person"
    sameAs = [
      "https://www.linkedin.com/in/abunayla/",
      "https://x.com/abunayla_",
      "https://github.com/hannody",
    ]

  # Home page: intro block followed by all posts, newest first.
  # (PaperMod's profileMode renders the profile *instead of* the post list.)
  # The name lives in the header (site.Title), so the h1 here does
  # positioning work instead of repeating it. Full bio lives at /about/.
  [params.homeInfoParams]
    Title = "AI systems that hold up in production"
    Content = """
I design and run LLM inference pipelines, OCR engines, and ML platforms on
on-prem GPU Kubernetes clusters, for government, insurance, healthcare, and
finance, where compliance is non-negotiable.

When there's no established answer, whether that's new infrastructure, a new
AI capability, or a complex integration, I'm the one brought in to assess,
decide, build, and deliver. [More about me](/about/)

Python · Kubernetes · GPU Infrastructure · LLM/VLM Systems · OCR · FastAPI · MLOps · Computer Vision · Observability

## Articles
"""

  # Site title in the header links here instead of home.
  # Consumed by the layouts/_partials/header.html override.
  [params.label]
    url = "https://www.linkedin.com/in/abunayla/"

[menu]
# The logo/site title points off-site to LinkedIn, so Home is what gets you
# back. The header partial renders it a house icon (see layouts/_partials).
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menu.main]]
  name = "Blog"
  url = "/posts/"
  weight = 2
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 3
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4
[[menu.main]]
  name = "X"
  url = "https://x.com/abunayla_"
  weight = 5