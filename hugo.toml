baseURL = "https://hannody.github.io/"
title = "Welcome, my name is Mohanad Abu-Nayla"
theme = "PaperMod"

defaultContentLanguage = "en"

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1

[params]
  mainSections = ["posts"]
  ShowReadingTime = true

  # Home page: intro block followed by all posts, newest first.
  # (PaperMod's profileMode renders the profile *instead of* the post list.)
  [params.homeInfoParams]
    Title = "Mohanad"
    Content = """
Senior Backend & AI Platform Engineer | Distributed Systems | LLM Deployment

## Articles
"""

  # Site title in the header links here instead of home.
  # Consumed by the layouts/_partials/header.html override.
  [params.label]
    url = "https://www.linkedin.com/in/abunayla/"

[menu]
[[menu.main]]
  name = "Blog"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 2