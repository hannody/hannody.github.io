name: Deploy Hugo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # enableGitInfo derives lastmod from commit dates; a shallow clone
          # would collapse every post's lastmod to the deploy commit.
          fetch-depth: 0
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
      - name: Build
        run: hugo --minify --baseURL "https://hannody.github.io/"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public